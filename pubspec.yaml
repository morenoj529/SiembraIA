name: siembra_ia
description: SiembraIA - App móvil para monitoreo agrícola inteligente
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.1.3

  # HTTP
  http: ^1.2.1

  # Image picker
  image_picker: ^1.1.2

  # Charts
  fl_chart: ^0.68.0

  # UI helpers
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Geolocator
  geolocator: ^12.0.0

  # Shared preferences (cache)
  shared_preferences: ^2.2.3

  # UUID
  uuid: ^4.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
